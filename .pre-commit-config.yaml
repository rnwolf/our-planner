repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0 # Use the latest stable ruff version
    hooks:
      - id: ruff-check
        args: [--fix] # Automatically fixes eligible lint errors before committing
      - id: ruff-format # Replaces Black for lightning-fast formatting

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.70
    hooks:
      - id: ty
